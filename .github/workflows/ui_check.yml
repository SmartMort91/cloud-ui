name: UI check (emulator screenshots)

# Throwaway helper: renders some layouts in the Glass theme on an emulator and uploads the
# screenshots, so UI problems can be checked without a phone. Only runs on the ui-check branch.

on:
  workflow_dispatch:
  push:
    branches: [ ui-check ]

permissions:
  contents: write

concurrency:
  group: ui-check
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Get target SDK
        id: sdk
        run: |
          TARGET_SDK=$(grep 'targetSdk' gradle/libs.versions.toml | grep -o '[0-9]\+' | head -1)
          echo "version=$TARGET_SDK" >> $GITHUB_OUTPUT

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.sdk.outputs.version }}
          arch: x86_64
          profile: Nexus 6
          script: |
            adb logcat -c
            ./gradlew connectedPrereleaseDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.lagradost.cloudstream3.CarCheckTest || echo failed > gradle_failed.txt
            mkdir -p uishots
            adb logcat -d > /tmp/full_logcat.txt
            grep -E "CARCHECK|CarMediaService|AndroidRuntime|FATAL|Media3|media3|MediaBrowser|MediaSession|ExoPlayer" /tmp/full_logcat.txt | tail -n 600 > uishots/car_log.txt || true

      - name: Publish screenshots to a scratch branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -r uishots/. /tmp/out/ 2>/dev/null || true
          cp gradle_failed.txt /tmp/out/ 2>/dev/null || true
          find /tmp/out -type f | head -20
          cd /tmp/out
          git init -q
          git config user.name "ui-check"
          git config user.email "ui-check@users.noreply.github.com"
          git checkout -q -b ui-shots-out
          git add -A
          git commit -q -m "screenshots from run ${{ github.run_id }}" || echo "nothing to commit"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ui-shots-out

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-shots
          path: |
            uishots
            gradle_failed.txt
            **/build/reports/androidTests/
          if-no-files-found: warn
